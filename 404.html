<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>stokz</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0720">
<link rel="icon" href="/assets/img/stokz.ico?v=2" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/stokz-32.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/img/stokz-192.png?v=2">
<link rel="apple-touch-icon" href="/assets/img/stokz-180.png?v=2">
<style>
@font-face{font-family:Bowlby;src:url(/assets/fonts/bowlby.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Unbounded;src:url(/assets/fonts/unbounded.woff2) format('woff2');font-weight:200 900;font-display:swap}
@font-face{font-family:Inter;src:url(/assets/fonts/inter.woff2) format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:JBM;src:url(/assets/fonts/jbm.woff2) format('woff2');font-weight:100 800;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;color:#fbf6ec;background:#0b0720;-webkit-font-smoothing:antialiased;overflow:hidden}
.bg{position:fixed;inset:0;background:url(/assets/img/stokz-city.jpg) 50% 100%/cover no-repeat;transform:scale(1.06);animation:drift 40s ease-in-out infinite alternate}
@keyframes drift{to{transform:scale(1.12) translate(-1.5%,1%)}}
.veil{position:fixed;inset:0;background:radial-gradient(60% 50% at 50% 44%,rgba(11,7,32,.55),transparent 72%),linear-gradient(180deg,rgba(11,7,32,.35),rgba(11,7,32,.45) 55%,rgba(11,7,32,.88))}
main{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
/* a quote screen from the city, showing the one ticker that is not there */
.scr{display:grid;justify-items:center;gap:10px;padding:26px 40px 24px;border-radius:12px;background:radial-gradient(circle,#1c1426 42%,transparent 47%) 0 0/4px 4px,#050309;border:1px solid #2a1d3a;box-shadow:inset 0 0 0 1px #000,0 40px 80px -40px #000;animation:in 1s cubic-bezier(.2,.8,.2,1) both}
.led{-webkit-mask:radial-gradient(circle,#000 52%,transparent 60%) 0 0/4px 4px;mask:radial-gradient(circle,#000 52%,transparent 60%) 0 0/4px 4px}
.n{font:800 clamp(96px,17vw,190px)/.9 JBM,ui-monospace,monospace;letter-spacing:.04em;color:#ffb03d;animation:blink 2.6s steps(1) 1.2s infinite}
.tag{font:800 clamp(18px,2.4vw,28px)/1 JBM,monospace;letter-spacing:.28em;color:#ff4d6d;padding-left:.28em}
@keyframes blink{0%,86%{opacity:1}88%,92%{opacity:.15}90%,100%{opacity:1}}
h1{margin-top:30px;font:400 clamp(26px,3.6vw,44px)/1 Bowlby,Unbounded,sans-serif;color:#fbf6ec;text-shadow:.045em .045em 0 #20be6c,.085em .085em 0 #030b1e;animation:in 1s .15s cubic-bezier(.2,.8,.2,1) both}
p{margin-top:14px;max-width:440px;color:#cdc1ec;line-height:1.6;text-shadow:0 1px 12px rgba(11,7,32,.9);animation:in 1s .25s cubic-bezier(.2,.8,.2,1) both}
.b{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:28px;animation:in 1s .35s cubic-bezier(.2,.8,.2,1) both}
.b a{display:inline-flex;align-items:center;height:52px;padding:0 26px;border-radius:999px;font:700 13px/1 Unbounded,sans-serif;letter-spacing:.04em;text-decoration:none;transition:transform .25s,box-shadow .25s,background .25s}
.b a.p{background:#3ddc84;color:#06150d;box-shadow:0 10px 30px -10px rgba(61,220,132,.7),inset 0 -3px 0 rgba(0,0,0,.18)}
.b a.s{color:#fbf6ec;border:1px solid rgba(255,255,255,.22);background:rgba(20,10,48,.5)}
.b a:hover{transform:translateY(-2px)}
.b a:focus-visible{outline:2px solid #3ddc84;outline-offset:3px}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div><div class="veil" aria-hidden="true"></div>
<main>
  <div class="scr" aria-hidden="true"><div class="n led">404</div><div class="tag led">DELISTED</div></div>
  <h1>Nothing trades here</h1>
  <p>This address isn't on the board. Every real listing is one tap away.</p>
  <div class="b"><a class="p" href="/app#board">Open the big board</a><a class="s" href="/">Back to the city</a></div>
</main>
</body>
</html>
