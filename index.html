<script type="module">
const $ = s => document.querySelector(s);
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const root = document.documentElement;
const gl = (() => { try { const c = document.createElement('canvas'); return !!(c.getContext('webgl2') || c.getContext('webgl')); } catch { return false; } })();
// the opening bell plays first when the city can render; everything else waits for it
const INTRO = gl && !RM;
if (gl) root.classList.add('gl');
if (INTRO) root.classList.add('intro');
requestAnimationFrame(() => root.classList.add('entered'));
// split-flap feature words
const AZ = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function flap(el) {
  if (el._run) return; el._run = 1; clearTimeout(el._t);
  const text = el.dataset.t; el.classList.add('on'); if (RM) { el.textContent = text; return; }
  const T = text.toUpperCase(), t0 = performance.now(), D = 520 + T.length * 14;
  const step = () => {
    const k = Math.min(1, (performance.now() - t0) / D), n = Math.floor(k * T.length);
    el.textContent = k >= 1 ? text : T.split('').map((c, i) => c === ' ' || i < n ? c : AZ[(Math.random() * 26) | 0]).join('');
    if (k < 1) setTimeout(step, 30);
  };
  step(); setTimeout(() => { el.textContent = text; }, D + 2500);
}
const FL = [...document.querySelectorAll('#feat span')];
const flapAll = base => FL.forEach((s, i) => { if (!s._run) { clearTimeout(s._t); s._t = setTimeout(() => flap(s), base + i * 170); } });
flapAll((INTRO ? 2150 : 0) + 1050);
// CA + X only when set
const C = window.STOKZ || {};
if (C.x) $('#links').insertAdjacentHTML('afterbegin', `<a class="pill" href="${C.x}" target="_blank" rel="noopener" aria-label="stokz on X"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.8 3h3.3l-7.2 8.2L22.4 21h-6.6l-5.2-6.8L4.7 21H1.4l7.7-8.8L1 3h6.8l4.7 6.2L17.8 3Zm-1.2 16h1.8L7.5 4.9H5.6L16.6 19Z"/></svg></a>`);
if (C.ca) { $('#links').insertAdjacentHTML('afterbegin', `<button class="pill" id="ca" title="Copy the contract address">CA ${C.ca.slice(0, 4)}…${C.ca.slice(-4)}</button>`); $('#ca').onclick = async () => { try { await navigator.clipboard.writeText(C.ca); $('#ca').textContent = 'COPIED'; setTimeout(() => $('#ca').textContent = `CA ${C.ca.slice(0, 4)}…${C.ca.slice(-4)}`, 1400); } catch {} }; }
// the city
let city = null;
function skip() {
  if (!root.classList.contains('intro')) return;
  root.classList.remove('intro'); city && city.skip(); flapAll(120);
}
if (INTRO) for (const ev of ['pointerdown', 'keydown', 'wheel', 'touchstart']) addEventListener(ev, skip, { passive: true, once: false });
if (gl) import('/assets/js/stokz3d.js?v=s4').then(m => {
  city = m.startCity($('#city'), { still: RM, onFirst: () => $('#city').classList.add('on') });
  window.__stokz = city;
  if (stocks.length) city.setTicker(stocks);
  if (!root.classList.contains('intro')) city.skip();

// live prices: the towers' LED screens and the tags
const fx = (v) => v >= 1000 ? v.toLocaleString('en-US', { maximumFractionDigits: 0 }) : v >= 1 ? v.toFixed(2) : v.toPrecision(3);
let stocks = [];
async function prices() {
  try { const r = await fetch('/api/m?a=prices', { cache: 'no-store' }); if (!r.ok) throw 0; const j = await r.json(); stocks = (j.stocks || []).filter(s => isFinite(s.usd) && s.usd > 0 && !s.thin); } catch { return; }
  if (!stocks.length) return;
  city && city.setTicker(stocks);
}
prices(); setInterval(prices, 60000);
let side = -1;
function spawn() {
  if (!city || !stocks.length || document.hidden || RM) return;
  side = -side; const spots = city.tops(side); if (!spots.length) return;
  const live = new Set([...document.querySelectorAll('#tags .tag')].map(t => t.dataset.s));
  const own = spots.filter(o => o.s && !live.has(o.s.sym));

  if (own.length) { p = own[(Math.random() * own.length) | 0]; s = p.s; }
  else { p = spots[(Math.random() * spots.length) | 0]; const pool = stocks.slice(0, 30).filter(x => !live.has(x.sym)); if (!pool.length) return; s = pool[(Math.random() * pool.length) | 0]; }
  const up = (s.ch24 || 0) >= 0; const el = document.createElement('div'); el.className = 'tag'; el.dataset.s = s.sym;
  el.style.left = Math.max(110, Math.min(innerWidth - 110, p.x)) + 'px'; el.style.top = p.y - 6 + 'px';
  el.innerHTML = `<span class="lg">${s.sym.slice(0, 2)}</span><b>${s.sym}</b>$${fx(s.usd)}<span class="${up ? 'u' : 'd'}">${up ? '▲' : '▼'}${Math.abs(s.ch24 || 0).toFixed(2)}%</span>`;
  $('#tags').appendChild(el); setTimeout(() => el.remove(), 5400);

if (innerWidth > 760) setTimeout(() => setInterval(spawn, 1500), INTRO ? 5200 : 2600);
</script>
